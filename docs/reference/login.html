<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiDi-todo | 高级登录注册弹窗</title>
    <style>
        /* 导入优雅的衬线字体(标题) 和 现代无衬线字体(正文) */
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #FAF7F2;        /* 奶油白 */
            --surface-color: #FFFFFF;   /* 卡片纯白 */
            --text-primary: #1C1917;    /* 深炭黑 */
            --text-secondary: #78716C;  /* 灰褐色 */
            --accent: #B88E57;          /* 香槟金 */
            --border-color: #E7E5DF;    /* 暖灰边框 */
            --font-serif: 'Playfair Display', serif; 
            --font-sans: 'Inter', -apple-system, sans-serif; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: var(--bg-color);
            /* 为了演示弹窗，让页面内容居中 */
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
        }

        /* 页面上的演示触发按钮 */
        .btn-trigger {
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 15px 40px;
            font-family: var(--font-sans);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .btn-trigger:hover {
            background: var(--accent);
        }

        /* =========================================
           高级弹窗核心样式 (Auth Modal)
           ========================================= */
        
        /* 1. 磨砂玻璃遮罩层 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(250, 247, 242, 0.7); /* 奶油色微透光 */
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* 2. 纯白质感卡片 */
        .modal-card {
            background: var(--surface-color);
            width: 100%;
            max-width: 440px;
            padding: 40px 40px 50px;
            border: 1px solid rgba(0,0,0,0.04);
            box-shadow: 0 20px 40px rgba(0,0,0,0.03);
            position: relative;
            transform: translateY(20px) scale(0.98);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        /* 3. 关闭按钮 (右上角细线叉号) */
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            background: none; border: none;
            font-size: 28px; color: var(--text-secondary);
            font-weight: 300; cursor: pointer;
            transition: 0.3s;
            z-index: 10;
        }
        .close-btn:hover { color: var(--text-primary); transform: rotate(90deg); }

        /* 4. 极简选项卡 (登录/注册切换) */
        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }
        .auth-tab {
            background: none;
            border: none;
            font-family: var(--font-sans);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0 0 10px 0;
            margin-bottom: -1px; /* 覆盖底部边框 */
            border-bottom: 1px solid transparent;
            transition: 0.3s;
        }
        .auth-tab.active {
            color: var(--text-primary);
            font-weight: 600;
            border-bottom-color: var(--text-primary);
        }

        /* 5. 头部标题排版 */
        .modal-header { margin-bottom: 35px; }
        .modal-title {
            font-family: var(--font-serif); 
            font-size: 2rem; 
            font-weight: 400; 
            margin-bottom: 8px;
        }
        .modal-title span { font-style: italic; color: var(--text-secondary); }
        .modal-desc { font-size: 13px; color: var(--text-secondary); }

        /* 6. 表单输入区 (下划线极简风) */
        .input-group { margin-bottom: 25px; position: relative; }
        .input-group label {
            display: block; font-size: 10px; text-transform: uppercase;
            letter-spacing: 2px; color: var(--text-secondary); margin-bottom: 5px;
        }
        .input-group input {
            width: 100%; padding: 10px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-sans); font-size: 14px; color: var(--text-primary);
            outline: none; transition: 0.3s;
        }
        .input-group input::placeholder { color: #d6d3cd; font-weight: 300; }
        .input-group input:focus { border-bottom-color: var(--accent); }

        /* 辅助链接 */
        .form-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .link { font-size: 12px; color: var(--text-secondary); text-decoration: none; transition: 0.3s;}
        .link:hover { color: var(--accent); }

        /* 7. 提交按钮 (香槟金常驻) */
        .btn-submit {
            width: 100%; padding: 14px 0;
            background: var(--text-primary); color: #fff;
            border: 1px solid var(--text-primary);
            font-family: var(--font-sans); font-size: 12px; text-transform: uppercase;
            letter-spacing: 2px; font-weight: 600; cursor: pointer; transition: 0.4s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--accent); border-color: var(--accent); }

        /* 8. 视图切换逻辑 */
        .auth-view { display: none; animation: fadeIn 0.4s ease; }
        .auth-view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <!-- 页面中心触发按钮 -->
    <button class="btn-trigger" onclick="openModal('login')">登录 / 注册</button>

    <!-- ================= 弹窗模块开始 ================= -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-card">
            <!-- 关闭按钮 -->
            <button class="close-btn" onclick="closeModal()">×</button>

            <!-- 顶部分类选项卡 -->
            <div class="auth-tabs">
                <button class="auth-tab active" id="tab-login" onclick="switchView('login')">Log In</button>
                <button class="auth-tab" id="tab-register" onclick="switchView('register')">Sign Up</button>
            </div>

            <!-- 1. 登录表单视图 -->
            <div id="view-login" class="auth-view active">
                <div class="modal-header">
                    <h2 class="modal-title">Welcome <span>Back</span></h2>
                    <p class="modal-desc">请输入您的凭证以进入工作台。</p>
                </div>
                
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••">
                </div>
                
                <div class="form-actions">
                    <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-secondary); cursor:pointer;">
                        <input type="checkbox" style="width:auto; margin:0;"> 记住我
                    </label>
                    <a href="#" class="link">忘记密码?</a>
                </div>
                
                <button class="btn-submit">Sign In</button>
            </div>

            <!-- 2. 注册表单视图 -->
            <div id="view-register" class="auth-view">
                <div class="modal-header">
                    <h2 class="modal-title">Join <span>DiDi-todo</span></h2>
                    <p class="modal-desc">注册账号，开启优雅的效率之旅。</p>
                </div>
                
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="您的姓名">
                </div>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="设置密码 (不少于8位)">
                </div>
                
                <button class="btn-submit">Create Account</button>
            </div>

        </div>
    </div>
    <!-- ================= 弹窗模块结束 ================= -->

    <!-- 控制弹窗的 Javascript -->
    <script>
        const modal = document.getElementById('authModal');
        const loginView = document.getElementById('view-login');
        const registerView = document.getElementById('view-register');
        const tabLogin = document.getElementById('tab-login');
        const tabRegister = document.getElementById('tab-register');

        // 打开弹窗并指定显示哪个视图 ('login' 或 'register')
        function openModal(viewType = 'login') {
            modal.classList.add('active');
            switchView(viewType);
        }

        // 关闭弹窗
        function closeModal() {
            modal.classList.remove('active');
        }

        // 点击外部遮罩层关闭弹窗
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        // 切换登录/注册视图的核心逻辑
        function switchView(viewType) {
            if (viewType === 'login') {
                // 激活登录相关的 DOM
                registerView.classList.remove('active');
                tabRegister.classList.remove('active');
                
                loginView.classList.add('active');
                tabLogin.classList.add('active');
            } else {
                // 激活注册相关的 DOM
                loginView.classList.remove('active');
                tabLogin.classList.remove('active');
                
                registerView.classList.add('active');
                tabRegister.classList.add('active');
            }
        }
    </script>
</body>
</html>
