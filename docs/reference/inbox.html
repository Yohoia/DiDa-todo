<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiDa-todo | Inbox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #FAF7F2;
            --surface-color: #FFFFFF;   
            --text-primary: #1C1917;    
            --text-secondary: #78716C;  
            --text-muted: #A8A29E;      
            --accent: #B88E57;          
            --accent-light: rgba(184, 142, 87, 0.1);
            --border-color: #E7E5DF;    
            --success-color: #9CA3AF;   
            --font-serif: 'Playfair Display', serif; 
            --font-sans: 'Inter', -apple-system, sans-serif; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans);
            color: var(--text-primary);
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px 100px;
            -webkit-font-smoothing: antialiased;
        }

        .page-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .header h1 { font-family: var(--font-serif); font-size: 2.8rem; font-weight: 400; line-height: 1.1; margin-bottom: 8px;}
        .header .subtitle { font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase;}

        .section-label {
            font-size: 11px; text-transform: uppercase; letter-spacing: 3px;
            color: var(--text-secondary); margin-bottom: 20px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .section-label::after {
            content: ''; flex: 1; height: 1px; background: var(--border-color); margin-left: 15px;
        }

        .task-list { display: flex; flex-direction: column; gap: 12px; }
        .task-row {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 18px 20px;
            display: flex; align-items: center; gap: 15px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
        }
        .task-row:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 25px var(--accent-light); }
        
        .checkbox {
            width: 18px; height: 18px; border: 1px solid var(--text-secondary);
            border-radius: 50%; cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .task-row:hover .checkbox { border-color: var(--accent); }
        .task-row.completed .checkbox { background: var(--accent); border-color: var(--accent); color: #fff; }
        .task-row.completed .checkbox::after { content: '✓'; font-size: 10px; }
        .task-row.completed .task-title { color: var(--success-color); text-decoration: line-through; }

        .task-content { flex: 1; display: flex; justify-content: space-between; align-items: center; }
        .task-title { font-size: 14px; color: var(--text-primary); font-weight: 500; }
        
        .quick-input-box {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }
        .quick-input { border: none; outline: none; font-family: var(--font-sans); font-size: 14px; width: 100%; background: transparent; color: var(--text-primary); }
        
        /* Inbox Zero 状态展示区 */
        .inbox-zero {
            display: none;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 80px 20px; background: var(--surface-color);
            border: 1px solid var(--border-color); border-radius: 6px;
        }
        .inbox-zero h3 { font-family: var(--font-serif); font-size: 1.8rem; font-weight: 400; margin-bottom: 10px; }
        .inbox-zero p { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; }

        /* 悬浮 Dock */
        .floating-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid var(--border-color);
            padding: 10px 20px; border-radius: 100px; display: flex; align-items: center; gap: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.06); z-index: 100;
        }
        .dock-item {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            color: var(--text-secondary); cursor: pointer; transition: 0.3s; position: relative; text-decoration: none;
        }
        .dock-item:hover, .dock-item.active { color: var(--text-primary); transform: translateY(-3px);}
        .dock-item.active::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .dock-icon { font-size: 20px; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; opacity: 0; transition: 0.2s; position: absolute; top: -20px;}
        .dock-item:hover .dock-label { opacity: 1; transform: translateY(-5px); }
        
        .dock-main-btn {
            background: var(--text-primary); color: #fff; width: 40px; height: 40px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 300; cursor: pointer; transition: 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .dock-main-btn:hover { background: var(--accent); transform: scale(1.1) rotate(90deg); }
    </style>
</head>
<body>

    <div class="page-container">
        <header class="header">
            <h1>Inbox</h1>
            <div class="subtitle" id="taskCounter">3 unorganized tasks</div>
        </header>

        <!-- 未整理任务列表 -->
        <div class="task-list" id="taskListContainer">
            <div class="task-row" onclick="completeAndRemove(this)">
                <div class="checkbox"></div>
                <div class="task-content">
                    <span class="task-title">看一下新出的前端 UI 框架与设计系统</span>
                    <span style="font-size: 11px; color: var(--text-muted);">Unorganized</span>
                </div>
            </div>

            <div class="task-row" onclick="completeAndRemove(this)">
                <div class="checkbox"></div>
                <div class="task-content">
                    <span class="task-title">云服务器带宽与套餐续费确认</span>
                    <span style="font-size: 11px; color: var(--text-muted);">Unorganized</span>
                </div>
            </div>

            <div class="task-row" onclick="completeAndRemove(this)">
                <div class="checkbox"></div>
                <div class="task-content">
                    <span class="task-title">和导师预约时间聊一下毕业论文大纲</span>
                    <span style="font-size: 11px; color: var(--text-muted);">Unorganized</span>
                </div>
            </div>
        </div>

        <!-- Inbox Zero 状态 (默认隐藏，清空后显示) -->
        <div class="inbox-zero" id="inboxZeroState">
            <h3>Inbox Zero</h3>
            <p>Everything is organized. Clean slate achieved.</p>
        </div>

        <!-- 快速添加输入栏 -->
        <div class="quick-input-box">
            <input type="text" class="quick-input" placeholder="Dump what's on your mind..." autofocus>
            <span style="font-size: 12px; color: var(--accent); font-weight: 600; cursor: pointer;">Add</span>
        </div>
    </div>

    <!-- 底部 Dock (对应激活 Inbox) -->
    <nav class="floating-dock">
        <a href="today.html" class="dock-item">
            <span class="dock-label">Today</span>
            <span class="dock-icon">◷</span>
        </a>
        <a href="inbox.html" class="dock-item active">
            <span class="dock-label">Inbox</span>
            <span class="dock-icon">📥</span>
        </a>
        <div class="dock-main-btn">＋</div>
        <a href="upcoming.html" class="dock-item">
            <span class="dock-label">Upcoming</span>
            <span class="dock-icon">📅</span>
        </a>
        <div class="dock-item">
            <span class="dock-label">Profile</span>
            <span class="dock-icon" style="font-size: 16px; border: 1px solid currentColor; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;">A</span>
        </div>
    </nav>

    <script>
        let remainingTasks = 3;
        function completeAndRemove(rowElement) {
            rowElement.classList.add('completed');
            setTimeout(() => {
                rowElement.style.opacity = '0';
                setTimeout(() => {
                    rowElement.remove();
                    remainingTasks--;
                    document.getElementById('taskCounter').innerText = remainingTasks + " unorganized tasks";
                    if (remainingTasks === 0) {
                        document.getElementById('taskListContainer').style.display = 'none';
                        document.getElementById('inboxZeroState').style.display = 'flex';
                        document.getElementById('taskCounter').innerText = "Inbox Zero";
                    }
                }, 300);
            }, 300);
        }
    </script>
</body>
</html>
