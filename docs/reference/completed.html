<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiDa-todo | Archive & Completed</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #FAF7F2; --surface-color: #FFFFFF;   
            --text-primary: #1C1917; --text-secondary: #78716C;  
            --text-muted: #A8A29E; --border-color: #E7E5DF;    
            --accent: #B88E57; --success-color: #9CA3AF;
            --font-serif: 'Playfair Display', serif; --font-sans: 'Inter', sans-serif; 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-sans); color: var(--text-primary);
            background-color: var(--bg-color); min-height: 100vh;
            display: flex; justify-content: center; padding: 40px 20px 100px;
            -webkit-font-smoothing: antialiased;
        }

        .page-container { width: 100%; max-width: 750px; display: flex; flex-direction: column; gap: 30px; }

        .header h1 { font-family: var(--font-serif); font-size: 2.8rem; font-weight: 400; line-height: 1.1; margin-bottom: 4px; }
        .header .subtitle { font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase; }

        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-color); margin-left: 15px; }

        .archive-list { display: flex; flex-direction: column; gap: 8px; }
        .archive-row {
            background: var(--surface-color); border: 1px solid var(--border-color);
            padding: 14px 20px; border-radius: 4px; display: flex; align-items: center;
            justify-content: space-between; opacity: 0.8 transition: 0.2s;
        }
        .archive-row:hover { opacity: 1; border-color: var(--text-secondary); }

        .title-done { text-decoration: line-through; color: var(--success-color); font-size: 14px; }
        .completed-at { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

        .action-btns { display: flex; gap: 10px; }
        .btn-act { background: none; border: 1px solid var(--border-color); padding: 4px 10px; font-size: 11px; cursor: pointer; border-radius: 3px; transition: 0.2s; color: var(--text-secondary); }
        .btn-act:hover { border-color: var(--text-primary); color: var(--text-primary); }
        .btn-act.danger:hover { border-color: #DC2626; color: #DC2626; }

        /* Floating Dock */
        .floating-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 100px; display: flex; align-items: center; gap: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); z-index: 100; }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); cursor: pointer; transition: 0.3s; position: relative; text-decoration: none; }
        .dock-item:hover, .dock-item.active { color: var(--text-primary); transform: translateY(-3px); }
        .dock-item.active::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .dock-icon { font-size: 20px; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; opacity: 0; transition: 0.2s; position: absolute; top: -20px; }
        .dock-item:hover .dock-label { opacity: 1; transform: translateY(-5px); }
        .dock-main-btn { background: var(--text-primary); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 300; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="header">
            <h1>Archive</h1>
            <div class="subtitle">Completed History (128 Items)</div>
        </header>

        <div>
            <div class="section-label">Yesterday · Sep 8</div>
            <div class="archive-list">
                <div class="archive-row">
                    <div>
                        <div class="title-done">修改登录页面逻辑交互 bug</div>
                        <div class="completed-at">Completed at 21:40</div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-act" onclick="this.closest('.archive-row').remove()"> Restore</button>
                        <button class="btn-act danger" onclick="this.closest('.archive-row').remove()">Delete</button>
                    </div>
                </div>

                <div class="archive-row">
                    <div>
                        <div class="title-done">预订周末高铁票与酒店</div>
                        <div class="completed-at">Completed at 14:15</div>
                    </div>
                    <div class="action-btns">
                        <button class="btn-act" onclick="this.closest('.archive-row').remove()">Restore</button>
                        <button class="btn-act danger" onclick="this.closest('.archive-row').remove()">Delete</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Dock -->
    <nav class="floating-dock">
        <a href="today.html" class="dock-item"><span class="dock-label">Today</span><span class="dock-icon">◷</span></a>
        <a href="inbox.html" class="dock-item"><span class="dock-label">Inbox</span><span class="dock-icon">📥</span></a>
        <div class="dock-main-btn">＋</div>
        <a href="completed.html" class="dock-item active"><span class="dock-label">Archive</span><span class="dock-icon">✓</span></a>
        <a href="profile.html" class="dock-item"><span class="dock-label">Profile</span><span class="dock-icon" style="font-size: 16px; border: 1px solid currentColor; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;">A</span></a>
    </nav>
</body>
</html>
