<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiDa-todo | Profile & Garden</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Inter:wght@300;400;500;600&display=swap');
        :root {
            --bg-color: #FAF7F2; --surface-color: #FFFFFF; --text-primary: #1C1917; --text-secondary: #78716C;  
            --border-color: #E7E5DF; --accent: #B88E57; 
            --font-serif: 'Playfair Display', serif; --font-sans: 'Inter', sans-serif; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--text-primary); background-color: var(--bg-color); min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px 100px; -webkit-font-smoothing: antialiased; }
        .page-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 40px; }
        
        /* Profile Header */
        .profile-header { display: flex; align-items: center; gap: 25px; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; background: var(--text-primary); color: #fff; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 2rem; }
        .user-info h1 { font-family: var(--font-serif); font-size: 2.2rem; font-weight: 400; }
        .user-meta { font-size: 13px; color: var(--text-secondary); letter-spacing: 1px; display: flex; gap: 15px; margin-top: 5px; }

        /* XP Level Bar */
        .xp-container { background: var(--surface-color); border: 1px solid var(--border-color); padding: 25px; border-radius: 4px; }
        .xp-header { display: flex; justify-content: space-between; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; font-weight: 600; }
        .progress-track { width: 100%; height: 6px; background: var(--bg-color); border-radius: 3px; overflow: hidden; border: 1px solid var(--border-color); }
        .progress-fill { width: 68%; height: 100%; background: var(--accent); }

        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-color); margin-left: 15px; }

        /* Focus Garden */
        .garden-box { background: var(--surface-color); border: 1px solid var(--border-color); padding: 40px 20px; text-align: center; border-radius: 4px; position: relative; overflow: hidden; }
        .garden-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; font-size: 35px; line-height: 1; }
        .tree { filter: drop-shadow(0 5px 5px rgba(0,0,0,0.05)); transition: 0.3s; cursor: pointer; }
        .tree:hover { transform: scale(1.1) translateY(-5px); }
        .empty-slot { width: 35px; height: 35px; border: 1px dashed var(--border-color); border-radius: 50%; opacity: 0.5; }

        /* Floating Dock */
        .floating-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 100px; display: flex; align-items: center; gap: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); z-index: 100; }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); cursor: pointer; transition: 0.3s; position: relative; text-decoration: none; }
        .dock-item:hover, .dock-item.active { color: var(--text-primary); transform: translateY(-3px);}
        .dock-item.active::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .dock-icon { font-size: 20px; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; opacity: 0; transition: 0.2s; position: absolute; top: -20px;}
        .dock-item:hover .dock-label { opacity: 1; transform: translateY(-5px); }
        .dock-main-btn { background: var(--text-primary); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 300; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="page-container">
        
        <div class="profile-header">
            <div class="avatar">A</div>
            <div class="user-info">
                <h1>Alex</h1>
                <div class="user-meta">
                    <span>Member since Sep 2026</span>
                    <span style="color: var(--accent);">Level 5 Architect</span>
                </div>
            </div>
        </div>

        <div class="xp-container">
            <div class="xp-header">
                <span>LVL 5</span>
                <span style="color: var(--text-secondary); font-weight: 400;">3,450 / 5,000 XP to next level</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill"></div>
            </div>
        </div>

        <div>
            <div class="section-label">Focus Garden</div>
            <div class="garden-box">
                <div style="font-size: 13px; color: var(--text-secondary); margin-bottom: 30px; font-family: var(--font-serif); font-style: italic;">
                    "Every 2 hours of deep work grows a new tree."
                </div>
                <div class="garden-grid">
                    <span class="tree">🌲</span>
                    <span class="tree">🌳</span>
                    <span class="tree">🪴</span>
                    <span class="tree">🌲</span>
                    <span class="tree" style="font-size: 25px; margin-top: 10px;">🌱</span>
                    <span class="empty-slot"></span>
                    <span class="empty-slot"></span>
                    <span class="empty-slot"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Dock -->
    <nav class="floating-dock">
        <a href="today.html" class="dock-item"><span class="dock-label">Today</span><span class="dock-icon">◷</span></a>
        <a href="inbox.html" class="dock-item"><span class="dock-label">Inbox</span><span class="dock-icon">📥</span></a>
        <div class="dock-main-btn">＋</div>
        <a href="upcoming.html" class="dock-item"><span class="dock-label">Upcoming</span><span class="dock-icon">📅</span></a>
        <a href="profile.html" class="dock-item active">
            <span class="dock-label">Profile</span>
            <span class="dock-icon" style="font-size: 16px; border: 1px solid currentColor; border-radius: 50%; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center;">A</span>
        </a>
    </nav>
</body>
</html>
