<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiDa-todo | Insights</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600&family=Inter:wght@300;400;500;600&display=swap');
        :root {
            --bg-color: #FAF7F2; --surface-color: #FFFFFF; --text-primary: #1C1917; --text-secondary: #78716C;  
            --border-color: #E7E5DF; --accent: #B88E57; --accent-light: rgba(184, 142, 87, 0.2);
            --font-serif: 'Playfair Display', serif; --font-sans: 'Inter', sans-serif; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-sans); color: var(--text-primary); background-color: var(--bg-color); min-height: 100vh; display: flex; justify-content: center; padding: 40px 20px 100px; -webkit-font-smoothing: antialiased; }
        .page-container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 40px; }
        
        .header h1 { font-family: var(--font-serif); font-size: 2.8rem; font-weight: 400; line-height: 1.1; margin-bottom: 4px;}
        .header .subtitle { font-size: 13px; color: var(--text-secondary); letter-spacing: 2px; text-transform: uppercase;}
        
        .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 3px; color: var(--text-secondary); margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }
        .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border-color); margin-left: 15px; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-card { background: var(--surface-color); border: 1px solid var(--border-color); padding: 30px; text-align: center; }
        .stat-num { font-family: var(--font-serif); font-size: 3rem; color: var(--accent); margin-bottom: 5px; }
        .stat-desc { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); }

        .heatmap-container { background: var(--surface-color); border: 1px solid var(--border-color); padding: 25px; display: flex; flex-direction: column; gap: 10px; }
        .heatmap-grid { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; }
        .heat-cell { aspect-ratio: 1; background: var(--bg-color); border-radius: 2px; border: 1px solid rgba(0,0,0,0.03); }
        .heat-cell.lv1 { background: var(--accent-light); }
        .heat-cell.lv2 { background: rgba(184, 142, 87, 0.5); }
        .heat-cell.lv3 { background: var(--accent); }

        /* Floating Dock */
        .floating-dock { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); border: 1px solid var(--border-color); padding: 10px 20px; border-radius: 100px; display: flex; align-items: center; gap: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); z-index: 100; }
        .dock-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-secondary); cursor: pointer; transition: 0.3s; position: relative; text-decoration: none; }
        .dock-item:hover, .dock-item.active { color: var(--text-primary); transform: translateY(-3px);}
        .dock-item.active::after { content: ''; position: absolute; bottom: -8px; width: 4px; height: 4px; background: var(--accent); border-radius: 50%; }
        .dock-icon { font-size: 20px; }
        .dock-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; opacity: 0; transition: 0.2s; position: absolute; top: -20px;}
        .dock-item:hover .dock-label { opacity: 1; transform: translateY(-5px); }
        .dock-main-btn { background: var(--text-primary); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 300; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="page-container">
        <header class="header">
            <h1>Insights</h1>
            <div class="subtitle">September 2026</div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-num">42</div>
                <div class="stat-desc">Tasks Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-num">18<span style="font-size:1.2rem;">h</span></div>
                <div class="stat-desc">Deep Work Focused</div>
            </div>
        </div>

        <div>
            <div class="section-label">Consistency Map</div>
            <div class="heatmap-container">
                <div class="heatmap-grid" id="heatmap">
                    <!-- JS 生成模拟色块 -->
                </div>
                <div style="font-size: 11px; color: var(--text-secondary); text-align: right; margin-top: 10px;">Current Streak: <strong>5 Days</strong></div>
            </div>
        </div>
    </div>

    <!-- Dock (Insights 没有独立图标，通常归并在左侧边栏或 Profile 中，这里我们借用 Profile 图标高亮) -->
    <nav class="floating-dock">
        <a href="today.html" class="dock-item"><span class="dock-label">Today</span><span class="dock-icon">◷</span></a>
        <a href="inbox.html" class="dock-item"><span class="dock-label">Inbox</span><span class="dock-icon">📥</span></a>
        <div class="dock-main-btn">＋</div>
        <a href="upcoming.html" class="dock-item"><span class="dock-label">Upcoming</span><span class="dock-icon">📅</span></a>
        <a href="insights.html" class="dock-item active"><span class="dock-label">Insights</span><span class="dock-icon">📊</span></a>
    </nav>

    <script>
        // 随机生成热力图区块演示
        const heatmap = document.getElementById('heatmap');
        const classes = ['heat-cell', 'heat-cell lv1', 'heat-cell lv2', 'heat-cell lv3'];
        for(let i=0; i<42; i++) {
            let div = document.createElement('div');
            // 越近期的日期，高亮概率越大
            let randomLevel = Math.floor(Math.random() * (i > 30 ? 4 : 3));
            div.className = classes[randomLevel];
            heatmap.appendChild(div);
        }
    </script>
</body>
</html>
