<!-- Supabase → Authentication → Email Templates → Change Email Address -->
<!-- Subject：确认换绑 DiDa-todo 邮箱 -->
<!-- 发送对象：新邮箱（点击确认链接后换绑生效） -->
<div style="margin:0;padding:0;background-color:#ffffff;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="width:560px;max-width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;color:#171717;">
          <tr>
            <td style="padding:0 0 28px;font-size:13px;letter-spacing:4px;font-weight:600;color:#b88e57;">DI&nbsp;DA&nbsp;TODO</td>
          </tr>
          <tr>
            <td style="padding:0 0 16px;">
              <h1 style="margin:0;font-size:26px;line-height:1.35;font-weight:700;color:#171717;">确认换绑邮箱</h1>
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 28px;font-size:15px;line-height:1.7;color:#525252;">
              你的 DiDa-todo 账号正在申请将登录邮箱更换为 <strong style="color:#171717;">{{ .Email }}</strong>。请点击下方按钮确认此次换绑。
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 32px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" style="background-color:#171717;border-radius:8px;padding:15px 12px;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;font-size:14px;font-weight:600;letter-spacing:2px;color:#ffffff;text-decoration:none;">确认换绑</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 0 32px;font-size:14px;line-height:1.7;color:#525252;">
              确认后，你将使用此新邮箱登录 DiDa-todo，原邮箱将不再用于登录。为保障账号安全，请尽快完成确认。
            </td>
          </tr>
          <tr>
            <td style="border-top:1px solid #e5e5e5;padding-top:20px;font-size:12px;line-height:1.8;color:#a3a3a3;">
              如果这不是你本人的操作，请直接忽略此邮件，邮箱不会发生任何变化。DiDa-todo 团队绝不会通过电话、聊天或其他邮件向你索取账号信息。<br />
              © 2026 DiDa-todo. 保留所有权利。
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</div>
