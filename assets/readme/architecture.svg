<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">DiDa-todo 系统地图</title>
  <desc id="arch-desc">Next.js 客户端经数据访问边界连接 Supabase 云端，Resend 负责验证码邮件，语音 AI 为可选服务。</desc>

  <rect width="1200" height="440" rx="8" fill="#FAF7F2"/>
  <path d="M0 324H1200" stroke="#E7E5DF"/>

  <text x="56" y="52" fill="#B88E57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">SYSTEM MAP · 系统地图</text>

  <!-- 卡片一：客户端 -->
  <g transform="translate(56 84)">
    <rect width="316" height="228" rx="14" fill="#FFFFFF" stroke="#E7E5DF"/>
    <text x="24" y="34" fill="#B88E57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CLIENT</text>
    <text x="24" y="64" fill="#1C1917" font-family="Georgia, Songti SC, serif" font-size="24" font-weight="600">Next.js 工作台</text>
    <g transform="translate(24 102)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" fill="#1C1917">
      <g>
        <circle cx="9" cy="-6" r="9" fill="#B88E57"/>
        <path d="M5 -6l2.6 2.6 5-5.6" fill="none" stroke="#FAF7F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">服务端组件 · 页面骨架</text>
      </g>
      <g transform="translate(0 36)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">客户端岛屿 · 任务与专注</text>
      </g>
      <g transform="translate(0 72)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">类型化词典 · 中英双语</text>
      </g>
      <g transform="translate(0 108)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">语义变量 · 浅色与暗色</text>
      </g>
    </g>
  </g>

  <!-- 箭头一 -->
  <path d="M372 198H444" stroke="#B88E57" stroke-width="1.6" fill="none"/>
  <path d="M452 198l-9-5v10Z" fill="#B88E57"/>
  <text x="412" y="182" fill="#78716C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">RSC · API</text>

  <!-- 卡片二：数据访问边界 -->
  <g transform="translate(452 84)">
    <rect width="296" height="228" rx="14" fill="#FFFFFF" stroke="#E7E5DF"/>
    <text x="24" y="34" fill="#B88E57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">DATA BOUNDARY</text>
    <text x="24" y="64" fill="#1C1917" font-family="Georgia, Songti SC, serif" font-size="24" font-weight="600">数据访问边界</text>
    <g transform="translate(48 96)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" fill="#1C1917">
      <rect width="200" height="30" rx="8" fill="#FAF7F2" stroke="#D8D3CB"/>
      <text x="100" y="20" text-anchor="middle">UI 功能模块</text>
      <path d="M100 38v10" stroke="#B88E57" stroke-width="1.6" fill="none"/>
      <path d="M100 53l-4.5-8h9Z" fill="#B88E57"/>
      <rect y="58" width="200" height="30" rx="8" fill="#FAF7F2" stroke="#D8D3CB"/>
      <text x="100" y="78" text-anchor="middle">Service 业务规则</text>
      <path d="M100 96v10" stroke="#B88E57" stroke-width="1.6" fill="none"/>
      <path d="M100 111l-4.5-8h9Z" fill="#B88E57"/>
      <rect y="116" width="200" height="30" rx="8" fill="#FAF7F2" stroke="#D8D3CB"/>
      <text x="100" y="136" text-anchor="middle">Repository 数据访问</text>
    </g>
  </g>

  <!-- 箭头二 -->
  <path d="M748 198H820" stroke="#B88E57" stroke-width="1.6" fill="none"/>
  <path d="M828 198l-9-5v10Z" fill="#B88E57"/>
  <text x="788" y="182" fill="#78716C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">REST</text>

  <!-- 卡片三：云端 -->
  <g transform="translate(828 84)">
    <rect width="316" height="228" rx="14" fill="#FFFFFF" stroke="#E7E5DF"/>
    <text x="24" y="34" fill="#B88E57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">CLOUD · TOKYO</text>
    <text x="24" y="64" fill="#1C1917" font-family="Georgia, Songti SC, serif" font-size="24" font-weight="600">Supabase</text>
    <g transform="translate(24 102)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="19" fill="#1C1917">
      <g>
        <circle cx="9" cy="-6" r="9" fill="#B88E57"/>
        <path d="M5 -6l2.6 2.6 5-5.6" fill="none" stroke="#FAF7F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="32" y="0">Auth · 验证码与密码</text>
      </g>
      <g transform="translate(0 36)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">Postgres · RLS 行级安全</text>
      </g>
      <g transform="translate(0 72)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">资料 · 偏好 · 语音记录</text>
      </g>
      <g transform="translate(0 108)">
        <circle cx="9" cy="-6" r="9" fill="none" stroke="#B88E57" stroke-width="1.8"/>
        <text x="32" y="0">迁移由 Actions 同步</text>
      </g>
    </g>
  </g>

  <!-- 卫星：语音与邮件 -->
  <g transform="translate(56 352)">
    <rect width="420" height="56" rx="10" fill="#FFFFFF" stroke="#E7E5DF" stroke-dasharray="4 4"/>
    <text x="24" y="25" fill="#1C1917" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="600">语音 AI（可选）</text>
    <text x="24" y="45" fill="#78716C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">BAILIAN ASR · DEEPSEEK PARSE</text>
  </g>
  <g transform="translate(724 352)">
    <rect width="420" height="56" rx="10" fill="#FFFFFF" stroke="#E7E5DF" stroke-dasharray="4 4"/>
    <text x="24" y="25" fill="#1C1917" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="18" font-weight="600">Resend SMTP</text>
    <text x="24" y="45" fill="#78716C" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">验证码 · 密码重置邮件</text>
  </g>
</svg>
